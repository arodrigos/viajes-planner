name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CORREOS_PERMITIDOS no es un secreto de producto (lo es la lista real de
# Adrián, que vive solo en Vercel); es el valor de prueba que necesita
# cualquier `npm run build` en CI desde que el prebuild lo exige (acceso-ac2).
# Cada test pide su propio código, así que su buzón de Mailpit nunca tiene
# más de un mensaje (no hay que suponer en qué orden Mailpit devolvería dos
# mensajes de la misma dirección) y el límite de trabajos por hora, que se
# cuenta por usuario, queda aislado entre pruebas que corren en paralelo
# (fullyParallel: true).
# Suma del bloque canje-de-codigo-en-servidor: ci-test-cod-ac1/ac2/ac3, uno
# por test de verificarCodigo.integration.test.ts -- el correo ajeno de
# cod-ac3 se crea dinámicamente en el propio test y NO se añade aquí, porque
# el criterio es justo que esté fuera de esta lista.
# Suma del bloque codigo-en-la-misma-pantalla: ci-test-pantalla-ac5/ac6-*/
# ac8a/ac8b/ac8c/ac8d-*, uno o dos por criterio pantalla-ac5..ac8 -- retirados
# los correos de seg-ac2 y acceso-ac6a/b, que solo usaban las pruebas del
# enlace mágico que este bloque retira (confirm.e2e.ts, acceso-ac6a.e2e.ts,
# acceso-ac6b.e2e.ts, destinoSeguro.test.ts). Los correos "-no-autorizado"
# de pantalla-ac6/ac8d se generan dinámicamente y NO se añaden aquí, porque
# el criterio es justo que estén fuera de esta lista.
# Suma del bloque guia-y-textos-sin-enlace: ci-test-guia-ac11, el único de
# los tres criterios que necesita canjear un código de verdad (recorrido
# completo hasta el trabajo encolado) -guia-ac10 no toca el flujo de acceso
# y guia-ac12(b) pide el código con un correo generado dinámicamente, porque
# la respuesta es uniforme y no necesita estar en la lista para llegar al
# paso del código.
# Suma del bloque cierre-de-auditoria-del-acceso-por-codigo: ci-test-aud-ac4,
# el único de los tres tests de aud-ac4/aud-ac5 que compara el aviso de un
# correo autorizado contra uno no autorizado -los otros dos usan un correo
# generado dinámicamente porque el aviso es texto estático y no depende de
# la lista blanca.
# Suma del bloque maquetacion-del-plan: ci-test-plan-timeline, el correo del
# usuario de prueba de plan-timeline.movil.e2e.ts (maq-ac1/maq-ac2b/maq-ac3),
# que necesita canjear un código real -mismo motivo que ci-test-final-ac2-.
# Suma del bloque mis-viajes: ci-test-viajes-ac2, la sesión "válida" de
# route.integration.test.ts (viajes-ac2, el correo ajeno y el de B se
# generan dinámicamente y NO se añaden aquí, porque el criterio es justo que
# estén fuera de esta lista); ci-test-mis-viajes, el usuario A real de
# mis-viajes.movil.e2e.ts (viajes-ac1/ac5, el usuario B se crea
# dinámicamente porque nunca inicia sesión).
# Suma del bloque eliminar-planificaciones: ci-test-eliminar, el usuario real
# de eliminar.movil.e2e.ts (borrar-ac1, único usuario del test, necesita
# canjear un código real); los usuarios de las pruebas de integración
# borrar-ac2/ac3 se generan dinámicamente y NO se añaden aquí, mismo motivo
# que ci-test-viajes-ac2 de arriba.
env:
  CORREOS_PERMITIDOS: "ci-test@example.com,ci-test-acceso-ac6c@example.com,ci-test-final-ac2@example.com,ci-test-cod-ac1@example.com,ci-test-cod-ac2@example.com,ci-test-cod-ac3@example.com,ci-test-pantalla-ac5@example.com,ci-test-pantalla-ac6-existente@example.com,ci-test-pantalla-ac6-nuevo@example.com,ci-test-pantalla-ac8a@example.com,ci-test-pantalla-ac8b@example.com,ci-test-pantalla-ac8c@example.com,ci-test-pantalla-ac8d-autorizado@example.com,ci-test-pantalla-ac8d-rastro-autorizado@example.com,ci-test-guia-ac11@example.com,ci-test-aud-ac4@example.com,ci-test-textos-ac1@example.com,ci-test-plan-timeline@example.com,ci-test-viajes-ac2@example.com,ci-test-mis-viajes@example.com,ci-test-eliminar@example.com"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  verificar-esqueleto:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: bash scripts/verificar-esqueleto.sh

  persistencia:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      # esquema-ac3(a,b): las migraciones aplican en limpio dentro de
      # `viajes_planner` y el esquema resultante coincide con el commiteado.
      - name: supabase db reset && supabase db diff (esquema viajes_planner limpio)
        run: |
          supabase db reset
          supabase db diff --schema viajes_planner > /tmp/db-diff.sql
          if [ -s /tmp/db-diff.sql ]; then
            echo "El esquema viajes_planner aplicado difiere de las migraciones commiteadas:"
            cat /tmp/db-diff.sql
            exit 1
          fi
      - name: exportar credenciales de la pila local
        run: |
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          # cliente-ac2: la fábrica de cliente (src/lib/db/cliente.ts) y el
          # ayudante de pruebas (clienteDePrueba.ts) leen SUPABASE_SCHEMA y
          # lanzan si falta -sin ella, npm run test:integration entero
          # fallaría, que es justo el fail-closed que corrige esta incisión.
          echo "SUPABASE_SCHEMA=viajes_planner" >> "$GITHUB_ENV"
      # esquema-ac3(c,d): las 12 tablas y las 3 funciones del catálogo viven
      # en `viajes_planner`, y `public` se queda sin un solo objeto del
      # producto -el efecto colateral que esta incisión corrige de raíz.
      - name: contar objetos por esquema (esquema-ac3)
        run: |
          set -euo pipefail
          contar() { psql "$SUPABASE_DB_URL" -tAc "$1" | tr -d '[:space:]'; }
          tablas_vp=$(contar "select count(*) from information_schema.tables where table_schema = 'viajes_planner'")
          tablas_public=$(contar "select count(*) from information_schema.tables where table_schema = 'public'")
          rutinas_vp=$(contar "select count(*) from information_schema.routines where routine_schema = 'viajes_planner'")
          rutinas_public=$(contar "select count(*) from information_schema.routines where routine_schema = 'public'")
          echo "tablas: viajes_planner=$tablas_vp public=$tablas_public"
          echo "rutinas: viajes_planner=$rutinas_vp public=$rutinas_public"
          [ "$tablas_vp" -eq 12 ]
          [ "$tablas_public" -eq 0 ]
          [ "$rutinas_vp" -eq 3 ]
          [ "$rutinas_public" -eq 0 ]
      # esquema-ac5: service_role conserva EXECUTE sobre las tres funciones y
      # DML sobre las tablas del esquema nuevo pese a los `revoke ... from
      # public`, y la clave anónima sigue sin poder ejecutar ninguna. Va
      # ANTES de test:integration a propósito: la cola tiene que estar
      # vacía de verdad ("cola vacía" del criterio), y test:integration
      # comparte la misma pila sin resetear entre ficheros, así que después
      # de ella la tabla trabajos ya no está garantizada a estar limpia.
      - name: privilegios de service_role sobre viajes_planner (esquema-ac5)
        run: |
          set -euo pipefail
          codigo() { curl -sS -o /tmp/r -w '%{http_code}' "$@"; }

          # (a) La cola sigue viva para service_role pese a los revoke.
          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/tomar_siguiente_trabajo" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci","p_arrendamiento_min":5}')
          [ "$c" = "200" ]
          [ "$(cat /tmp/r)" = "[]" ]

          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/adquirir_cerrojo_trabajador" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci","p_ttl_min":5}')
          [ "$c" = "200" ]
          [ "$(cat /tmp/r)" = "true" ]

          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/liberar_cerrojo_trabajador" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci"}')
          [ "$c" = "204" ] || [ "$c" = "200" ]

          # (b) La clave anónima sigue sin poder ejecutar la RPC de la cola.
          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/tomar_siguiente_trabajo" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci","p_arrendamiento_min":5}')
          [ "$c" != "200" ]

          # (c) Escritura real en `salud`: demuestra USAGE + DML sobre el
          # esquema nuevo, no solo EXECUTE sobre las tres funciones.
          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/salud" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -H "Prefer: return=representation" \
            -d '{"origen":"ci"}')
          [ "$c" = "201" ]
          fila_id=$(jq -r '.[0].id' /tmp/r)

          c=$(codigo "$SUPABASE_URL/rest/v1/salud?id=eq.$fila_id&select=id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept-Profile: viajes_planner")
          [ "$c" = "200" ]

          codigo -X DELETE "$SUPABASE_URL/rest/v1/salud?id=eq.$fila_id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Profile: viajes_planner" > /dev/null
      # esquema-ac4(a,b) (RLS contra el esquema propio, con el caso hermano
      # sin cabecera) y persistencia-ac3 (round-trip del fixture).
      - run: npm run test:integration
      # viajes-ac2(b): un build de producción real de /api/viajes sin
      # sesión responde 401 sin Set-Cookie. Vive aquí, no en
      # verificar-esqueleto.sh -esa comprobación NECESITA una pila de
      # Supabase real, que ese script omite a propósito para otro criterio
      # (ver la cabecera de scripts/verificar-viajes.sh).
      - run: bash scripts/verificar-viajes.sh

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # acceso-ac4/ac6: el camino de acceso completo (pedir el enlace,
      # leer el correo real del servidor de correo local y confirmarlo)
      # necesita la pila real de Supabase, no solo el doblado de red que
      # bastaba para el resto de las pantallas.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: exportar credenciales de la pila local
        run: |
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SCHEMA=viajes_planner" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      # visual-ac1/pantalla-ac9: el gatekeeper juzga estas capturas (issue
      # #141), no un veredicto mecánico -por eso se publican como artefacto
      # en vez de solo comprobarse en el propio job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-movil
          path: artefactos/capturas/
          retention-days: 30
          if-no-files-found: warn
