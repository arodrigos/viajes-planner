name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CORREOS_PERMITIDOS no es un secreto de producto (lo es la lista real de
# Adrián, que vive solo en Vercel); es el valor de prueba que necesita
# cualquier `npm run build` en CI desde que el prebuild lo exige (acceso-ac2).
# Cada test pide su propio código, así que su buzón de Mailpit nunca tiene
# más de un mensaje (no hay que suponer en qué orden Mailpit devolvería dos
# mensajes de la misma dirección) y el límite de trabajos por hora, que se
# cuenta por usuario, queda aislado entre pruebas que corren en paralelo
# (fullyParallel: true).
# Suma del bloque canje-de-codigo-en-servidor: ci-test-cod-ac1/ac2/ac3, uno
# por test de verificarCodigo.integration.test.ts -- el correo ajeno de
# cod-ac3 se crea dinámicamente en el propio test y NO se añade aquí, porque
# el criterio es justo que esté fuera de esta lista.
# Suma del bloque codigo-en-la-misma-pantalla: ci-test-pantalla-ac5/ac6-*/
# ac8a/ac8b/ac8c/ac8d-*, uno o dos por criterio pantalla-ac5..ac8 -- retirados
# los correos de seg-ac2 y acceso-ac6a/b, que solo usaban las pruebas del
# enlace mágico que este bloque retira (confirm.e2e.ts, acceso-ac6a.e2e.ts,
# acceso-ac6b.e2e.ts, destinoSeguro.test.ts). Los correos "-no-autorizado"
# de pantalla-ac6/ac8d se generan dinámicamente y NO se añaden aquí, porque
# el criterio es justo que estén fuera de esta lista.
# Suma del bloque guia-y-textos-sin-enlace: ci-test-guia-ac11, el único de
# los tres criterios que necesita canjear un código de verdad (recorrido
# completo hasta el trabajo encolado) -guia-ac10 no toca el flujo de acceso
# y guia-ac12(b) pide el código con un correo generado dinámicamente, porque
# la respuesta es uniforme y no necesita estar en la lista para llegar al
# paso del código.
# Suma del bloque cierre-de-auditoria-del-acceso-por-codigo: ci-test-aud-ac4,
# el único de los tres tests de aud-ac4/aud-ac5 que compara el aviso de un
# correo autorizado contra uno no autorizado -los otros dos usan un correo
# generado dinámicamente porque el aviso es texto estático y no depende de
# la lista blanca.
# Suma del bloque maquetacion-del-plan: ci-test-plan-timeline, el correo del
# usuario de prueba de plan-timeline.movil.e2e.ts (maq-ac1/maq-ac2b/maq-ac3),
# que necesita canjear un código real -mismo motivo que ci-test-final-ac2-.
# Suma del bloque mis-viajes: ci-test-viajes-ac2, la sesión "válida" de
# route.integration.test.ts (viajes-ac2, el correo ajeno y el de B se
# generan dinámicamente y NO se añaden aquí, porque el criterio es justo que
# estén fuera de esta lista); ci-test-mis-viajes, el usuario A real de
# mis-viajes.movil.e2e.ts (viajes-ac1/ac5, el usuario B se crea
# dinámicamente porque nunca inicia sesión).
# Suma del bloque eliminar-planificaciones: ci-test-eliminar, el usuario real
# de eliminar.movil.e2e.ts (borrar-ac1, único usuario del test, necesita
# canjear un código real); los usuarios de las pruebas de integración
# borrar-ac2/ac3 se generan dinámicamente y NO se añaden aquí, mismo motivo
# que ci-test-viajes-ac2 de arriba.
# Suma del bloque recomendaciones-de-sitios: ci-test-recomendaciones, el
# usuario real de recomendaciones.movil.e2e.ts (reco-ac4, único usuario del
# test, necesita canjear un código real para ver el plan sembrado).
# Suma del bloque auditoria-del-recorrido-real: ci-test-recorrido, el único
# usuario real de recorrido-completo.movil.e2e.ts (aud-ac1/ac2/ac3, canjea un
# código real de punta a punta) -- el segundo usuario del test de aislamiento
# se crea dinámicamente porque nunca inicia sesión, mismo motivo que
# ci-test-mis-viajes de arriba.
# Suma del bloque respuesta-uniforme-verificar-codigo: ci-test-unif-ac1, el
# correo autorizado de unif-ac1 (el ajeno de ese mismo test se crea
# dinámicamente, porque el criterio es justo que esté fuera de esta lista).
# CORREO_DE_PRUEBA para scripts/verificar-acceso-uniforme.sh (unif-ac5)
# reutiliza ci-test@example.com, que ya está en esta lista para otros pasos.
# Suma del bloque peso-visual-viajes-y-borrado: ci-test-peso-visual, el
# usuario real de peso-visual.movil.e2e.ts con sus dos viajes sembrados
# (peso-ac1/ac2/ac5/ac6); ci-test-peso-visual-vacio, la cuenta nueva sin
# viajes que comprueba el estado vacío (peso-ac7).
# Suma del bloque contraste-eliminar: ci-test-contraste-eliminar, el usuario
# real de contraste-eliminar.movil.e2e.ts (contraste-ac1, único usuario del
# test, necesita canjear un código real para ver «Mis viajes» con un viaje).
# Suma del bloque pedir-otro-viaje: ci-test-otro-viaje, el usuario real de
# pedir-otro-viaje.movil.e2e.ts (otro-ac1/ac2/ac4/ac5, canjea un código real,
# pulsa «Pedir otro viaje» desde «Mis viajes» y envía el formulario para que
# quede una fila nueva en trabajos). ci-test-peso-visual-vacio ya cubre
# otro-ac3, no hace falta un correo nuevo para ese criterio.
# Suma del bloque lugares-resolucion: ci-test-procedencia, el usuario real de
# procedencia.movil.e2e.ts (lug-ac7, canjea un código real para ver las
# marcas de "comprobada"/"sin comprobar" por parada).
# Suma del bloque mapa-del-dia: ci-test-mapa, el usuario real de
# mapa.movil.e2e.ts (map-ac1/ac2/ac3/ac4, canjea un código real para ver el
# mapa con marcadores numerados y el enlace al recorrido);
# ci-test-mapa-vacio y ci-test-mapa-caido, uno por cada caso de
# degradación de map-ac5 (día sin ninguna parada resuelta; OpenFreeMap
# caído), cada uno con su propio usuario para no compartir sesión ni
# límite de trabajos por hora con el test principal.
# Suma del bloque fotos-paradas: ci-test-fotos, el usuario real de
# fotos.movil.e2e.ts (fot-ac2/ac3, canjea un código real para ver la foto
# con su atribución y el marcador de posición "Sin foto").
# Suma del bloque alternativas-equivalentes: ci-test-alternativas, el
# usuario real de alternativas.movil.e2e.ts que sustituye una parada por
# una alternativa (alt-ac5); ci-test-alternativas-vacio, la parada sin
# alternativas de ese mismo test (alt-ac7), con su propio usuario para no
# compartir sesión con el principal.
# Suma del bloque uso-en-destino: ci-test-destino, el usuario real de
# destino.movil.e2e.ts (dest-ac1/ac2/ac5, canjea un código real con un plan
# sembrado cuyo primer día tiene la fecha de hoy, para marcar/desmarcar una
# parada como visitada y ver el mapa centrado en la siguiente); y
# ci-test-destino-no-hoy, el usuario de dest-ac3 (un día que no es hoy no
# muestra el botón de visita) -- faltaba en esta lista y el correo nunca
# llegaba a Mailpit.
# Suma del bloque exportar-calendario: ci-test-calendario, el usuario real
# de calendario.movil.e2e.ts (ics-ac2, canjea un código real para ver el
# botón "Añadir al calendario" y descargar el .ics) -- la sesión real de
# calendario.integration.test.ts (ics-ac1) usa generateLink/verifyOtp como
# el resto de integration.test.ts, que no pasa por esta lista.
# Suma del bloque encaje-y-paseo: ci-test-encaje, el usuario real de
# encaje-y-paseo.movil.e2e.ts (enc-ac1, canjea un código real para ver las
# etiquetas de encaje de una alternativa); ci-test-paseo, el usuario del
# mismo fichero para el aviso de "mucho paseo" (enc-ac2), con su propio
# usuario para no compartir sesión ni límite de trabajos por hora.
# Suma del bloque ciudad-a-mano: ci-test-ciudad, el usuario real de
# ciudad.movil.e2e.ts (man-ac1, aviso/motivo/ayuda/contador de un plan
# sin ciudad identificable); ci-test-ciudad-manual, el usuario del mismo
# fichero para decir la ciudad a mano (man-ac2), con su propio usuario
# para no competir por el mismo createUser ni compartir límite de
# trabajos por hora con el test anterior.
env:
  CORREOS_PERMITIDOS: "ci-test@example.com,ci-test-acceso-ac6c@example.com,ci-test-final-ac2@example.com,ci-test-cod-ac1@example.com,ci-test-cod-ac2@example.com,ci-test-cod-ac3@example.com,ci-test-pantalla-ac5@example.com,ci-test-pantalla-ac6-existente@example.com,ci-test-pantalla-ac6-nuevo@example.com,ci-test-pantalla-ac8a@example.com,ci-test-pantalla-ac8b@example.com,ci-test-pantalla-ac8c@example.com,ci-test-pantalla-ac8d-autorizado@example.com,ci-test-pantalla-ac8d-rastro-autorizado@example.com,ci-test-guia-ac11@example.com,ci-test-aud-ac4@example.com,ci-test-textos-ac1@example.com,ci-test-plan-timeline@example.com,ci-test-viajes-ac2@example.com,ci-test-mis-viajes@example.com,ci-test-eliminar@example.com,ci-test-recomendaciones@example.com,ci-test-recorrido@example.com,ci-test-unif-ac1@example.com,ci-test-peso-visual@example.com,ci-test-peso-visual-vacio@example.com,ci-test-contraste-eliminar@example.com,ci-test-otro-viaje@example.com,ci-test-procedencia@example.com,ci-test-mapa@example.com,ci-test-mapa-vacio@example.com,ci-test-mapa-caido@example.com,ci-test-fotos@example.com,ci-test-alternativas@example.com,ci-test-alternativas-vacio@example.com,ci-test-alternativas-completas@example.com,ci-test-sustituir@example.com,ci-test-regenerar@example.com,ci-test-regenerar-ac4@example.com,ci-test-destino@example.com,ci-test-destino-no-hoy@example.com,ci-test-calendario@example.com,ci-test-horario@example.com,ci-test-encaje@example.com,ci-test-paseo@example.com,ci-test-ciudad@example.com,ci-test-ciudad-manual@example.com,ci-test-presupuesto@example.com,ci-test-transporte@example.com"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  verificar-esqueleto:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: bash scripts/verificar-esqueleto.sh
      # rls-ac2: las migraciones pendientes tienen que pasar el filtro
      # aditivo real del job aplicar-migraciones ANTES de mergear, no
      # cuando main ya está en rojo.
      - run: bash scripts/verificar-migracion-aditiva.sh

  persistencia:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Versión fija del CLI: con "latest" setup-cli consulta la API de GitHub
      # en cada job y ese rate limit puso el CI en rojo sin tocar el código.
      # 2.117.0 es la que resolvía "latest" en los últimos runs verdes.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      # setup-cli fuerza SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io para
      # cualquier versión >= 1.28.0 o 'latest' (su propio dist/index.js:
      # "Use GHCR mirror by default"), y esa variable DESACTIVA el
      # fallback multi-registro que la CLI trae de serie -sin ella,
      # `supabase start` prueba public.ecr.aws, luego ghcr.io, luego
      # docker.io (supabase/cli, internal/utils/docker.go)-. Con el
      # registro fijado a uno solo, el toomanyrequests de ghcr.io no
      # tiene a dónde caer: es la causa real de que los tres intentos
      # anteriores (reintento con backoff, login autenticado, menos
      # imágenes) fallaran siempre con la misma firma, los tres seguían
      # atados a ghcr.io en solitario. Vaciar la variable aquí restaura
      # el fallback de la propia CLI sin tocar su versión.
      - name: restaurar el fallback multi-registro de la CLI (setup-cli lo fuerza a solo ghcr.io)
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
      # ghcr.io aplica un límite de tasa mucho más bajo a las descargas
      # anónimas que a las autenticadas (visto en los runs de d9cdc094 y su
      # PR: toomanyrequests en TODAS las imágenes de supabase, no en el
      # código). Autenticar con el GITHUB_TOKEN de la propia Action -de
      # solo lectura, sin secreto nuevo que gestionar- mueve las descargas
      # a la cuota por cuenta en vez de la cuota compartida por IP del
      # runner, que es la que se agota.
      - name: autenticar en ghcr.io (evita el límite anónimo por IP)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # El producto no usa Storage, Realtime, Edge Functions, Studio ni el
      # stack de analíticas (logflare/vector) -confirmado con grep sobre
      # src/: sin `.channel(`, `supabase.storage`, `supabase.functions`-.
      # Arrancarlos igualmente casi dobla el número de imágenes a
      # descargar en el mismo instante, lo que agrava el toomanyrequests.
      - name: iniciar Supabase local (con reintentos por si el límite persiste)
        run: |
          for intento in 1 2 3; do
            if supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor; then exit 0; fi
            echo "intento $intento de 'supabase start' falló, reintentando en 30s..."
            supabase stop --no-backup || true
            sleep 30
          done
          echo "'supabase start' falló tras 3 intentos"
          exit 1
      # esquema-ac3(a,b): las migraciones aplican en limpio dentro de
      # `viajes_planner` y el esquema resultante coincide con el commiteado.
      - name: supabase db reset && supabase db diff (esquema viajes_planner limpio)
        run: |
          supabase db reset
          supabase db diff --schema viajes_planner > /tmp/db-diff.sql
          if [ -s /tmp/db-diff.sql ]; then
            echo "El esquema viajes_planner aplicado difiere de las migraciones commiteadas:"
            cat /tmp/db-diff.sql
            exit 1
          fi
      - name: exportar credenciales de la pila local
        run: |
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          # cliente-ac2: la fábrica de cliente (src/lib/db/cliente.ts) y el
          # ayudante de pruebas (clienteDePrueba.ts) leen SUPABASE_SCHEMA y
          # lanzan si falta -sin ella, npm run test:integration entero
          # fallaría, que es justo el fail-closed que corrige esta incisión.
          echo "SUPABASE_SCHEMA=viajes_planner" >> "$GITHUB_ENV"
      # esquema-ac3(c,d): las 12 tablas y las 3 funciones del catálogo viven
      # en `viajes_planner`, y `public` se queda sin un solo objeto del
      # producto -el efecto colateral que esta incisión corrige de raíz.
      - name: contar objetos por esquema (esquema-ac3)
        run: |
          set -euo pipefail
          contar() { psql "$SUPABASE_DB_URL" -tAc "$1" | tr -d '[:space:]'; }
          tablas_vp=$(contar "select count(*) from information_schema.tables where table_schema = 'viajes_planner'")
          tablas_public=$(contar "select count(*) from information_schema.tables where table_schema = 'public'")
          rutinas_vp=$(contar "select count(*) from information_schema.routines where routine_schema = 'viajes_planner'")
          rutinas_public=$(contar "select count(*) from information_schema.routines where routine_schema = 'public'")
          echo "tablas: viajes_planner=$tablas_vp public=$tablas_public"
          echo "rutinas: viajes_planner=$rutinas_vp public=$rutinas_public"
          [ "$tablas_vp" -eq 13 ]
          [ "$tablas_public" -eq 0 ]
          [ "$rutinas_vp" -eq 3 ]
          [ "$rutinas_public" -eq 0 ]
      # rls-ac1: la política de SELECT sobre trabajos evalúa auth.uid() una
      # sola vez por consulta (subconsulta, no llamada desnuda por fila), y
      # sigue habiendo una única política sobre esa tabla.
      - name: política de trabajos evalúa auth.uid() una sola vez por consulta (rls-ac1)
        run: |
          set -euo pipefail
          numero=$(psql "$SUPABASE_DB_URL" -tAc "select count(*) from pg_policies where schemaname='viajes_planner' and tablename='trabajos'" | tr -d '[:space:]')
          echo "políticas de SELECT sobre trabajos: $numero"
          [ "$numero" = "1" ]
          qual=$(psql "$SUPABASE_DB_URL" -tAc "select qual from pg_policies where schemaname='viajes_planner' and tablename='trabajos'")
          echo "qual: $qual"
          echo "$qual" | grep -iq 'select auth.uid()'
      # esquema-ac5: service_role conserva EXECUTE sobre las tres funciones y
      # DML sobre las tablas del esquema nuevo pese a los `revoke ... from
      # public`, y la clave anónima sigue sin poder ejecutar ninguna. Va
      # ANTES de test:integration a propósito: la cola tiene que estar
      # vacía de verdad ("cola vacía" del criterio), y test:integration
      # comparte la misma pila sin resetear entre ficheros, así que después
      # de ella la tabla trabajos ya no está garantizada a estar limpia.
      - name: privilegios de service_role sobre viajes_planner (esquema-ac5)
        run: |
          set -euo pipefail
          codigo() { curl -sS -o /tmp/r -w '%{http_code}' "$@"; }

          # (a) La cola sigue viva para service_role pese a los revoke.
          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/tomar_siguiente_trabajo" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci","p_arrendamiento_min":5}')
          [ "$c" = "200" ]
          [ "$(cat /tmp/r)" = "[]" ]

          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/adquirir_cerrojo_trabajador" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci","p_ttl_min":5}')
          [ "$c" = "200" ]
          [ "$(cat /tmp/r)" = "true" ]

          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/liberar_cerrojo_trabajador" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci"}')
          [ "$c" = "204" ] || [ "$c" = "200" ]

          # (b) La clave anónima sigue sin poder ejecutar la RPC de la cola.
          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/rpc/tomar_siguiente_trabajo" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -d '{"p_tomado_por":"ci","p_arrendamiento_min":5}')
          [ "$c" != "200" ]

          # (c) Escritura real en `salud`: demuestra USAGE + DML sobre el
          # esquema nuevo, no solo EXECUTE sobre las tres funciones.
          c=$(codigo -X POST "$SUPABASE_URL/rest/v1/salud" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Content-Profile: viajes_planner" \
            -H "Prefer: return=representation" \
            -d '{"origen":"ci"}')
          [ "$c" = "201" ]
          fila_id=$(jq -r '.[0].id' /tmp/r)

          c=$(codigo "$SUPABASE_URL/rest/v1/salud?id=eq.$fila_id&select=id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept-Profile: viajes_planner")
          [ "$c" = "200" ]

          codigo -X DELETE "$SUPABASE_URL/rest/v1/salud?id=eq.$fila_id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Profile: viajes_planner" > /dev/null
      # esquema-ac4(a,b) (RLS contra el esquema propio, con el caso hermano
      # sin cabecera) y persistencia-ac3 (round-trip del fixture).
      - run: npm run test:integration
      # viajes-ac2(b): un build de producción real de /api/viajes sin
      # sesión responde 401 sin Set-Cookie. Vive aquí, no en
      # verificar-esqueleto.sh -esa comprobación NECESITA una pila de
      # Supabase real, que ese script omite a propósito para otro criterio
      # (ver la cabecera de scripts/verificar-viajes.sh).
      - run: bash scripts/verificar-viajes.sh
      # unif-ac5: smoke_test del manifiesto contra un build de producción
      # real -no solo el manejador en memoria de test:integration de arriba-,
      # en el job que ya tiene la pila local de Supabase levantada.
      - name: verificar respuesta uniforme de verificar-codigo (unif-ac5)
        run: CORREO_DE_PRUEBA=ci-test@example.com bash scripts/verificar-acceso-uniforme.sh

  # Issue #181 (claude-fleet-infra): el pipeline horizontal mergea migraciones
  # a `main` pero ningún paso las aplica de verdad contra el proyecto
  # Supabase real -- el run a89b lo demostró rompiendo "Mis viajes" en
  # producción (3 migraciones aprobadas por el gatekeeper, nunca aplicadas).
  # `needs` en TODOS los demás jobs a propósito: solo se dispara cuando el
  # resto ya está verde, para que el oráculo `comprobar_migraciones_aplicadas`
  # del runner (que espera a que el commit de merge esté "completed" del
  # todo) vea este job como parte del mismo conjunto de checks.
  aplicar-migraciones:
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, verificar-esqueleto, persistencia, e2e]
    # lug-ac5: desde el 2026-10-03 `dev` es la rama de trabajo y el
    # trabajador de VPS1 corre sobre ella, contra el MISMO proyecto
    # Supabase (DEV) que `main` -- sin aplicar también en `dev`, el primer
    # guardarPlan tras mergear la 011 falla con "column paradas.lugar does
    # not exist" (el fallo real del run a89b, ahora en la rama nueva).
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    env:
      SUPABASE_PROJECT_REF: ihgounrvbggdowbdtzrr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/aplicar-migraciones-reales.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Paso barato del issue #181 (claude-fleet-infra): la API de logs de
      # Actions no está disponible para el runner (issue #140) -- este
      # artefacto es lo que el gatekeeper sí puede descargar y leer ya
      # estructurado. `if: always()` porque el script escribe el JSON
      # también cuando rechaza una migración o falla a mitad (trap EXIT).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: resultado-migraciones
          path: resultado-migraciones.json
          retention-days: 30
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # acceso-ac4/ac6: el camino de acceso completo (pedir el enlace,
      # leer el correo real del servidor de correo local y confirmarlo)
      # necesita la pila real de Supabase, no solo el doblado de red que
      # bastaba para el resto de las pantallas.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      # Misma causa real que en el job `persistencia`: setup-cli fuerza
      # SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io y eso desactiva el
      # fallback multi-registro (ECR público -> ghcr.io -> Docker Hub) que
      # la propia CLI trae de serie. Vaciarla restaura ese fallback.
      - name: restaurar el fallback multi-registro de la CLI (setup-cli lo fuerza a solo ghcr.io)
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
      # Misma mitigación que en el job `persistencia`: autenticar en ghcr.io
      # con el GITHUB_TOKEN mueve la descarga de imágenes a la cuota por
      # cuenta, que es mucho más alta que la anónima por IP del runner.
      - name: autenticar en ghcr.io (evita el límite anónimo por IP)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: iniciar Supabase local (con reintentos por si el límite persiste)
        run: |
          for intento in 1 2 3; do
            if supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor; then exit 0; fi
            echo "intento $intento de 'supabase start' falló, reintentando en 30s..."
            supabase stop --no-backup || true
            sleep 30
          done
          echo "'supabase start' falló tras 3 intentos"
          exit 1
      - name: exportar credenciales de la pila local
        run: |
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SCHEMA=viajes_planner" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      # visual-ac1/pantalla-ac9: el gatekeeper juzga estas capturas (issue
      # #141), no un veredicto mecánico -por eso se publican como artefacto
      # en vez de solo comprobarse en el propio job.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capturas-movil
          path: artefactos/capturas/
          retention-days: 30
          if-no-files-found: warn
