name: Pruebas a demanda

# Lo lanzan las etapas del pipeline (desarrollo, gatekeeper, refutador) para
# ejecutar aquí, y no en su máquina, specs concretos de una rama: e2e de
# Playwright o unitarios. El repo es público y los minutos no cuestan nada.
# Las entradas se validan antes de usarlas y nunca se interpolan en un `run`.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "e2e | unit"
        required: true
        default: e2e
      specs:
        description: "Ficheros o filtros de test, separados por espacios (vacío = todos)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: validar la petición
        env:
          TIPO: ${{ inputs.tipo }}
          SPECS: ${{ inputs.specs }}
        run: |
          [[ "$TIPO" =~ ^(e2e|unit)$ ]] || { echo "::error::tipo inválido"; exit 1; }
          [[ "$SPECS" =~ ^[A-Za-z0-9_./*@,\ -]{0,500}$ ]] || { echo "::error::specs con caracteres no permitidos"; exit 1; }
          # La suite preview usa una sesión real: su registro sería público aquí.
          [[ "${SPECS,,}" != *preview* ]] || { echo "::error::la suite preview no se ejecuta en Actions"; exit 1; }
          echo "PRUEBAS_SPECS=$SPECS" >> "$GITHUB_ENV"
      - run: npm ci
      - name: unitarios
        if: inputs.tipo == 'unit'
        run: npx vitest run $PRUEBAS_SPECS
      - if: inputs.tipo == 'e2e'
        run: npx playwright install --with-deps chromium
      # Igual que el job e2e del CI: la pila real de Supabase en local.
      - if: inputs.tipo == 'e2e'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - if: inputs.tipo == 'e2e'
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
      - if: inputs.tipo == 'e2e'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: iniciar Supabase local
        if: inputs.tipo == 'e2e'
        run: |
          for intento in 1 2 3; do
            if supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor; then exit 0; fi
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1
      - name: credenciales de la pila local
        if: inputs.tipo == 'e2e'
        run: |
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SCHEMA=viajes_planner" >> "$GITHUB_ENV"
      - name: e2e
        if: inputs.tipo == 'e2e'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: resultado-e2e.json
        run: npx playwright test $PRUEBAS_SPECS --reporter=list,json
      # Los tests fallidos como anotaciones: la etapa los lee por la API.
      - if: failure() && inputs.tipo == 'e2e'
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("resultado-e2e.json")) { console.log("::error::Playwright no llegó a escribir resultado-e2e.json"); process.exit(0); }
            const visitar = (s) => { for (const x of s.suites ?? []) visitar(x); for (const sp of s.specs ?? []) { if (sp.ok) continue;
              const m = sp.tests.flatMap((t) => t.results).map((r) => r.error?.message ?? r.status).join(" | ");
              console.log("::error::" + (sp.file + " " + sp.title + ": " + m).replace(/\u001b\[[0-9;]*m/g, "").replace(/\s+/g, " ").slice(0, 900)); } };
            for (const s of JSON.parse(fs.readFileSync("resultado-e2e.json", "utf8")).suites) visitar(s);'
