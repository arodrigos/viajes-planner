name: Pruebas a demanda

# Lo lanzan las etapas del pipeline (desarrollo, gatekeeper, refutador) para
# ejecutar aquí, y no en su máquina, specs concretos de una rama: e2e de
# Playwright o unitarios. El repo es público y los minutos no cuestan nada.
# Las entradas se validan antes de usarlas y nunca se interpolan en un `run`.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "e2e | unit"
        required: true
        default: e2e
      specs:
        description: "Ficheros o filtros de test, separados por espacios (vacío = todos)"
        required: false
        default: ""

permissions:
  contents: read

# Mismo entorno que ci.yml: el prebuild (comprobar-entorno) aborta sin
# CORREOS_PERMITIDOS y la ficha de Google necesita la clave de navegador. Son
# valores ficticios y no secretos; scripts/__tests__/entorno-workflows.test.ts
# falla si los dos ficheros divergen, así que un correo de prueba nuevo se
# añade en los dos.
env:
  CORREOS_PERMITIDOS: "ci-test@example.com,ci-test-acceso-ac6c@example.com,ci-test-final-ac2@example.com,ci-test-cod-ac1@example.com,ci-test-cod-ac2@example.com,ci-test-cod-ac3@example.com,ci-test-pantalla-ac5@example.com,ci-test-pantalla-ac6-existente@example.com,ci-test-pantalla-ac6-nuevo@example.com,ci-test-pantalla-ac8a@example.com,ci-test-pantalla-ac8b@example.com,ci-test-pantalla-ac8c@example.com,ci-test-pantalla-ac8d-autorizado@example.com,ci-test-pantalla-ac8d-rastro-autorizado@example.com,ci-test-guia-ac11@example.com,ci-test-aud-ac4@example.com,ci-test-textos-ac1@example.com,ci-test-plan-timeline@example.com,ci-test-viajes-ac2@example.com,ci-test-mis-viajes@example.com,ci-test-eliminar@example.com,ci-test-recomendaciones@example.com,ci-test-recorrido@example.com,ci-test-unif-ac1@example.com,ci-test-peso-visual@example.com,ci-test-peso-visual-vacio@example.com,ci-test-contraste-eliminar@example.com,ci-test-otro-viaje@example.com,ci-test-procedencia@example.com,ci-test-mapa@example.com,ci-test-mapa-vacio@example.com,ci-test-mapa-caido@example.com,ci-test-fotos@example.com,ci-test-alternativas@example.com,ci-test-alternativas-vacio@example.com,ci-test-alternativas-completas@example.com,ci-test-sustituir@example.com,ci-test-regenerar@example.com,ci-test-regenerar-ac4@example.com,ci-test-destino@example.com,ci-test-destino-no-hoy@example.com,ci-test-calendario@example.com,ci-test-horario@example.com,ci-test-encaje@example.com,ci-test-paseo@example.com,ci-test-ciudad@example.com,ci-test-ciudad-manual@example.com,ci-test-presupuesto@example.com,ci-test-transporte@example.com,ci-test-inviable@example.com,ci-test-inviable-dueno@example.com,ci-test-inviable-otro@example.com,ci-test-ruta-etapas@example.com,ci-test-ruta-dias@example.com,ci-test-ruta-tren@example.com,ci-test-ruta-coche@example.com,ci-test-guia@example.com,ci-test-eventos@example.com,ci-test-infografia@example.com,ci-test-infografia-e2e@example.com,ci-test-infografia-multi-e2e@example.com,ci-test-infografia-larga-e2e@example.com,ci-test-infografia-previa-e2e@example.com,ci-test-infografia-previa-estados-e2e@example.com,ci-test-infografia-previa-sinsesion-e2e@example.com,ci-test-enlaces-e2e@example.com,ci-test-guia-consejo@example.com,ci-test-tramos-e2e@example.com,ci-test-tramos-cerca-e2e@example.com,ci-test-tramos-una-e2e@example.com,ci-test-alternativas-estado@example.com,ci-test-alternativas-error@example.com,ci-test-alternativas-doble@example.com,ci-test-alternativas-guia@example.com,ci-test-alternativas-singuia@example.com,ci-test-guia-curiosidades@example.com,ci-test-formato-miles@example.com,ci-test-formato-curiosidades@example.com,ci-test-proximos-pasados@example.com,ci-test-ahora@example.com,ci-test-ahora-sin-ubicar@example.com,ci-test-ahora-antes@example.com,ci-test-ahora-error@example.com,ci-test-sal-ac1@example.com,ci-test-sal-ac2a@example.com,ci-test-sal-ac2b@example.com,ci-test-sal-ac3@example.com,ci-test-mis-viajes-fechas@example.com,ci-test-ficha@example.com,ci-test-ficha-e2e@example.com,ci-test-aviso-horario@example.com,ci-test-obsoleto-a@example.com,ci-test-obsoleto-b@example.com,ci-test-sin-conexion@example.com,ci-test-copia-sesion@example.com,ci-test-orden@example.com,ci-test-orden-dia1@example.com,ci-test-orden-dia3@example.com,ci-test-orden-dia4@example.com,ci-test-orden-dia7@example.com,ci-test-orden-dia7b@example.com,ci-test-orden-dia9@example.com,ci-test-orden-ahora@example.com,ci-test-optimizar@example.com,ci-test-optimizar-ya@example.com,ci-test-optimizar-limites@example.com,ci-test-optimizar-franjas@example.com"
  NEXT_PUBLIC_GOOGLE_MAPS_CLAVE_NAVEGADOR: "clave-de-prueba-ci"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: validar la petición
        env:
          TIPO: ${{ inputs.tipo }}
          SPECS: ${{ inputs.specs }}
        run: |
          [[ "$TIPO" =~ ^(e2e|unit)$ ]] || { echo "::error::tipo inválido"; exit 1; }
          [[ "$SPECS" =~ ^[A-Za-z0-9_./*@,\ -]{0,500}$ ]] || { echo "::error::specs con caracteres no permitidos"; exit 1; }
          # La suite preview usa una sesión real: su registro sería público aquí.
          [[ "${SPECS,,}" != *preview* ]] || { echo "::error::la suite preview no se ejecuta en Actions"; exit 1; }
          echo "PRUEBAS_SPECS=$SPECS" >> "$GITHUB_ENV"
      - run: npm ci
      - name: unitarios
        if: inputs.tipo == 'unit'
        run: npx vitest run $PRUEBAS_SPECS
      - if: inputs.tipo == 'e2e'
        run: npx playwright install --with-deps chromium
      # Igual que el job e2e del CI: la pila real de Supabase en local.
      - if: inputs.tipo == 'e2e'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - if: inputs.tipo == 'e2e'
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
      - if: inputs.tipo == 'e2e'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: iniciar Supabase local
        if: inputs.tipo == 'e2e'
        run: |
          for intento in 1 2 3; do
            if supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor; then exit 0; fi
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1
      - name: credenciales de la pila local
        if: inputs.tipo == 'e2e'
        run: |
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SCHEMA=viajes_planner" >> "$GITHUB_ENV"
      - name: e2e
        if: inputs.tipo == 'e2e'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: resultado-e2e.json
        run: npx playwright test $PRUEBAS_SPECS --reporter=list,json
      # Los tests fallidos como anotaciones: la etapa los lee por la API.
      - if: failure() && inputs.tipo == 'e2e'
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("resultado-e2e.json")) { console.log("::error::Playwright no llegó a escribir resultado-e2e.json"); process.exit(0); }
            const visitar = (s) => { for (const x of s.suites ?? []) visitar(x); for (const sp of s.specs ?? []) { if (sp.ok) continue;
              const m = sp.tests.flatMap((t) => t.results).map((r) => r.error?.message ?? r.status).join(" | ");
              console.log("::error::" + (sp.file + " " + sp.title + ": " + m).replace(/\u001b\[[0-9;]*m/g, "").replace(/\s+/g, " ").slice(0, 900)); } };
            for (const s of JSON.parse(fs.readFileSync("resultado-e2e.json", "utf8")).suites) visitar(s);'
